name: Firebase App Distribution CD

# Trigger this workflow only when code is pushed to main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-distribute:

    # GitHub runner (fresh Ubuntu machine)
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # STEP 1: Checkout source code from GitHub repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # STEP 2: Setup Java (required for Android Gradle build)
      # ------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ------------------------------------------------------------
      # STEP 3: Setup Android SDK tools on GitHub runner
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # STEP 4: Accept Android SDK licenses automatically
      # (required or build-tools installation fails)
      # ------------------------------------------------------------
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      # ------------------------------------------------------------
      # STEP 5: Install required Android Build Tools
      # (needed for APK signing tools like zipalign, apksigner)
      # ------------------------------------------------------------
      - name: Install Android Build Tools
        run: sdkmanager "build-tools;36.0.0"

      # ------------------------------------------------------------
      # STEP 6: Give permission to Gradle wrapper script
      # ------------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ------------------------------------------------------------
      # STEP 7: Decode keystore from GitHub secret
      # (Base64 keystore → real keystore.jks file)
      # ------------------------------------------------------------
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > keystore.jks

      # ------------------------------------------------------------
      # STEP 8: Build RELEASE APK using Gradle
      # - Inject version code from GitHub run number
      # - Inject version name dynamically
      # - Signing happens inside Gradle using keystore.jks
      # ------------------------------------------------------------
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_DEVS_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_DEVS_ALIAS_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=1.0.${{ github.run_number }}

      # ------------------------------------------------------------
      # STEP 9: Find generated APK file (for debugging + upload)
      # ------------------------------------------------------------
      - name: Locate APK
        run: find app/build/outputs/apk/release -name "*.apk"

      # ------------------------------------------------------------
      # STEP 10: Install Firebase CLI tool
      # (used to upload APK to Firebase App Distribution)
      # ------------------------------------------------------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ------------------------------------------------------------
      # STEP 11: Create Firebase authentication file
      # (service account JSON stored in GitHub Secrets)
      # ------------------------------------------------------------
      - name: Setup Firebase Service Account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json

      # ------------------------------------------------------------
      # STEP 12: Upload APK to Firebase App Distribution
      # ------------------------------------------------------------
      - name: Upload to Firebase App Distribution
        run: |

          # Find the signed APK
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          echo "Uploading APK: $APK_PATH"

          # Set Firebase authentication
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json

          # Upload APK to Firebase testers group
          firebase appdistribution:distribute "$APK_PATH" \
            --app 1:439662827938:android:41cef8ff572e6aa3637afb \
            --groups "internal-testers" \
            --release-notes "Automated build #${{ github.run_number }}"