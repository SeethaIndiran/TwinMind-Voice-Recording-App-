name: Firebase App Distribution CD

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository (full history for release notes)
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Setup JDK 17
      # ------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ------------------------------------------------------------
      # 3. Setup Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # 4. Accept Android licenses
      # ------------------------------------------------------------
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      # ------------------------------------------------------------
      # 5. Install Build Tools
      # ------------------------------------------------------------
      - name: Install Android Build Tools
        run: sdkmanager "build-tools;36.0.0"

      # ------------------------------------------------------------
      # 6. Make Gradle executable
      # ------------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ------------------------------------------------------------
      # 7. Decode Keystore
      # ------------------------------------------------------------
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      # ------------------------------------------------------------
      # 8. Build APK + AAB
      # ------------------------------------------------------------
      - name: Build Release APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_DEVS_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_DEVS_ALIAS_PASSWORD }}
        run: |
          ./gradlew clean \
            assembleRelease \
            bundleRelease \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=1.0.${{ github.run_number }}

    

      # ------------------------------------------------------------
      # 10. Locate APK
      # ------------------------------------------------------------
      - name: Locate APK
        run: find app/build/outputs/apk/release -name "*.apk"

      # ------------------------------------------------------------
      # 11. Upload APK Artifact
      # ------------------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/
          retention-days: 30

      # ------------------------------------------------------------
      # 12. Upload AAB Artifact
      # ------------------------------------------------------------
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # ------------------------------------------------------------
      # 13. Install Firebase CLI
      # ------------------------------------------------------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      # ------------------------------------------------------------
      # 14. Setup Firebase Service Account
      # ------------------------------------------------------------
      - name: Setup Firebase Service Account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json

      # ------------------------------------------------------------
      # 15. Generate Release Notes (clean commit-based)
      # ------------------------------------------------------------
      - name: Generate Release Notes
        run: |
          echo "Release Build #${{ github.run_number }}" > release-notes.txt
          echo "Build Date: $(date -u)" >> release-notes.txt
          echo "" >> release-notes.txt

          # 👉 ADD ENVIRONMENT HERE
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "Environment: QA" >> release-notes.txt
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Environment: PRODUCTION" >> release-notes.txt
          else
            echo "Environment: DEV" >> release-notes.txt
          fi

          echo "" >> release-notes.txt
          echo "Latest Changes:" >> release-notes.txt

          git log -10 --no-merges --pretty=format:"- %s" >> release-notes.txt

          echo ""
          echo "Generated Release Notes:"
          cat release-notes.txt

      # ------------------------------------------------------------
      # 16. Upload to Firebase App Distribution
      # ------------------------------------------------------------
      - name: Upload to Firebase App Distribution
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          echo "Uploading APK: $APK_PATH"

          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json

          # Decide environment based on branch
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            GROUP="qa-testers"
            ENV="QA"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            GROUP="internal-testers"
            ENV="PRODUCTION"
          else
            GROUP="qa-testers"
            ENV="DEV"
          fi

          echo "Environment: $ENV"
          echo "Firebase Group: $GROUP"

          firebase appdistribution:distribute "$APK_PATH" \
            --app 1:439662827938:android:41cef8ff572e6aa3637afb \
            --groups "$GROUP" \
            --release-notes-file release-notes.txt

      # ------------------------------------------------------------
      # 17. Create Git Release Tag (Production Versioning)
      # ------------------------------------------------------------
      - name: Create Git Tag
        if: github.ref_name == 'main'
        run: |
          VERSION="v1.0.${{ github.run_number }}"

          echo "Creating Git tag: $VERSION"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Tag the current commit (IMPORTANT)
          git tag -a $VERSION -m "Release $VERSION"

          git push origin $VERSION
          
            # ------------------------------------------------------------
      # 18. Create GitHub Release (Production Only)
      # ------------------------------------------------------------
      - name: Create GitHub Release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body_path: release-notes.txt
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------------------------
      # 19. GitHub Build Summary (Production Visibility)
      # ------------------------------------------------------------
      - name: Build Summary
        if: always()
        run: |
          echo "## 🚀 Build Report #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📌 Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦 Artifacts Generated:" >> $GITHUB_STEP_SUMMARY
          echo "- APK (Firebase App Distribution)" >> $GITHUB_STEP_SUMMARY
          echo "- AAB (Play Store Ready)" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Artifacts (APK + AAB)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🌍 Environment:" >> $GITHUB_STEP_SUMMARY
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "QA" >> $GITHUB_STEP_SUMMARY
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "PRODUCTION" >> $GITHUB_STEP_SUMMARY
          else
            echo "DEV" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🔥 Firebase Distribution:" >> $GITHUB_STEP_SUMMARY
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "QA Testers" >> $GITHUB_STEP_SUMMARY
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Internal Testers" >> $GITHUB_STEP_SUMMARY
          else
            echo "Development Testers" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📝 Release Notes:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f release-notes.txt ]; then
            cat release-notes.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "- No release notes generated" >> $GITHUB_STEP_SUMMARY
          fi