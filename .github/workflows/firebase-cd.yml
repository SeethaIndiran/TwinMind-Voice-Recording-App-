name: Firebase App Distribution CD

on:
  push:
    branches:
      - develop
      - main

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Setup JDK 17
      # ------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ------------------------------------------------------------
      # 3. Setup Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # 4. Accept Android licenses
      # ------------------------------------------------------------
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      # ------------------------------------------------------------
      # 5. Install Build Tools
      # ------------------------------------------------------------
      - name: Install Android Build Tools
        run: sdkmanager "build-tools;36.0.0"

      # ------------------------------------------------------------
      # 6. Make Gradle executable
      # ------------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ------------------------------------------------------------
      # 7. Decode Keystore
      # ------------------------------------------------------------
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      # ------------------------------------------------------------
      # 8. Build APK + AAB
      # ------------------------------------------------------------
      - name: Build Release APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_DEVS_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_DEVS_ALIAS_PASSWORD }}
        run: |
          ./gradlew clean \
            assembleRelease \
            bundleRelease \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=1.0.${{ github.run_number }}

      # ------------------------------------------------------------
      # 9. Locate APK
      # ------------------------------------------------------------
      - name: Locate APK
        run: find app/build/outputs/apk/release -name "*.apk"

      # ------------------------------------------------------------
      # 10. Upload APK Artifact
      # ------------------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/
          retention-days: 30

      # ------------------------------------------------------------
      # 11. Upload AAB Artifact
      # ------------------------------------------------------------
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # ------------------------------------------------------------
      # 12. Install Firebase CLI
      # ------------------------------------------------------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ------------------------------------------------------------
      # 13. Setup Firebase Service Account
      # ------------------------------------------------------------
      - name: Setup Firebase Service Account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json

      # ------------------------------------------------------------
      # 14. Set Environment (QA / PROD)
      # ------------------------------------------------------------
      - name: Set Environment
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "ENV=QA" >> $GITHUB_ENV
            echo "GROUP=qa-testers" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENV=PRODUCTION" >> $GITHUB_ENV
            echo "GROUP=internal-testers" >> $GITHUB_ENV
          else
            echo "ENV=DEV" >> $GITHUB_ENV
            echo "GROUP=qa-testers" >> $GITHUB_ENV
          fi

      # ------------------------------------------------------------
      # 15. Show Environment in Logs
      # ------------------------------------------------------------
      - name: Show Environment Info
        run: |
          echo "🧠 Environment: $ENV"
          echo "👥 Firebase Group: $GROUP"

      # ------------------------------------------------------------
      # 16. Generate Release Notes (with environment label)
      # ------------------------------------------------------------
      - name: Generate Release Notes
        run: |
          echo "🚀 Build #${{ github.run_number }}" > release-notes.txt
          echo "Environment: $ENV" >> release-notes.txt
          echo "Branch: $GITHUB_REF_NAME" >> release-notes.txt
          echo "" >> release-notes.txt
          echo "Latest Changes:" >> release-notes.txt

          git log -10 --no-merges --pretty=format:"- %s" >> release-notes.txt

          echo ""
          echo "Generated Release Notes:"
          cat release-notes.txt

      # ------------------------------------------------------------
      # 17. Upload to Firebase App Distribution
      # ------------------------------------------------------------
      - name: Upload to Firebase App Distribution
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          echo "Uploading APK: $APK_PATH"

          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json

          firebase appdistribution:distribute "$APK_PATH" \
            --app 1:439662827938:android:41cef8ff572e6aa3637afb \
            --groups "$GROUP" \
            --release-notes-file release-notes.txt

      # ------------------------------------------------------------
      # 18. GitHub Build Summary
      # ------------------------------------------------------------
      - name: Build Summary
        if: always()
        run: |
          echo "## 🚀 Build Report #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📌 Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🧠 Environment: $ENV" >> $GITHUB_STEP_SUMMARY
          echo "### 👥 Group: $GROUP" >> $GITHUB_STEP_SUMMARY
          echo "### 🌿 Branch: $GITHUB_REF_NAME" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- APK (Firebase App Distribution)" >> $GITHUB_STEP_SUMMARY
          echo "- AAB (Play Store Ready)" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Release Notes:" >> $GITHUB_STEP_SUMMARY
          cat release-notes.txt >> $GITHUB_STEP_SUMMARY