name: Firebase App Distribution CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Setup Android SDK (IMPORTANT FIX)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Accept licenses
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      # 5. Install Build Tools (FIX for zipalign error)
      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;34.0.0"

      # 6. Make gradlew executable
      - name: Grant permission
        run: chmod +x gradlew

      # 7. Build Release APK
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=1.0.${{ github.run_number }}

      # 8. Find APK
      - name: Locate APK
        run: find app/build -type f -name "*.apk"

      # 9. Sign APK (FIXED now works because zipalign exists)
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.ANDROID_DEVS_ALIAS }}
          keyPassword: ${{ secrets.ANDROID_DEVS_ALIAS_PASSWORD }}

      # 10. Install Firebase CLI
      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      # 11. Authenticate Firebase
      - name: Authenticate Firebase
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json

      # 12. Upload to Firebase
      - name: Upload to Firebase
        run: |
          APK_PATH=$(find app/build -type f -name "*.apk" | head -n 1)

          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json

          firebase appdistribution:distribute "$APK_PATH" \
            --app 1:439662827938:android:41cef8ff572e6aa3637afb \
            --groups "internal-testers" \
            --release-notes "Automated build from GitHub Actions"