name: Firebase App Distribution CD

on:
  push:
    branches:
      - main

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Setup JDK 17 (Android build requirement)
      # ------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ------------------------------------------------------------
      # 3. Setup Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # 4. Accept Android licenses
      # ------------------------------------------------------------
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      # ------------------------------------------------------------
      # 5. Install Build Tools
      # ------------------------------------------------------------
      - name: Install Android Build Tools
        run: sdkmanager "build-tools;36.0.0"

      # ------------------------------------------------------------
      # 6. Make Gradle executable
      # ------------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ------------------------------------------------------------
      # 7. Decode Keystore (for signing release builds)
      # ------------------------------------------------------------
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      # ------------------------------------------------------------
      # 8. Build APK + AAB (Production build step)
      # ------------------------------------------------------------
      - name: Build Release APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_DEVS_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_DEVS_ALIAS_PASSWORD }}
        run: |
          ./gradlew clean \
            assembleRelease \
            bundleRelease \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=1.0.${{ github.run_number }}

      # ------------------------------------------------------------
      # 9. Locate APK (debug step)
      # ------------------------------------------------------------
      - name: Locate APK
        run: find app/build/outputs/apk/release -name "*.apk"

      # ------------------------------------------------------------
      # 10. Upload APK Artifact (Firebase + debugging)
      # ------------------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/
          retention-days: 30
          if-no-files-found: error

      # ------------------------------------------------------------
      # 11. Upload AAB Artifact (Play Store ready)
      # ------------------------------------------------------------
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      # ------------------------------------------------------------
      # 12. Install Firebase CLI
      # ------------------------------------------------------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ------------------------------------------------------------
      # 13. Setup Firebase Service Account
      # ------------------------------------------------------------
      - name: Setup Firebase Service Account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json

      # ------------------------------------------------------------
      # 14. Generate Release Notes from latest Git commit
      # ------------------------------------------------------------
      - name: Generate Release Notes
        run: |
          echo "Release Build #${{ github.run_number }}" > release-notes.txt
          echo "Build Date: $(date -u)" >> release-notes.txt
          echo "" >> release-notes.txt
          echo "Latest Changes:" >> release-notes.txt
          git log -1 --pretty=format:"- %s" >> release-notes.txt

          echo ""
          echo "Generated Release Notes:"
          cat release-notes.txt  

      # ------------------------------------------------------------
      # 15. Upload to Firebase App Distribution
      # ------------------------------------------------------------
      - name: Upload to Firebase App Distribution
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          echo "Uploading APK: $APK_PATH"

          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json

          firebase appdistribution:distribute "$APK_PATH" \
            --app 1:439662827938:android:41cef8ff572e6aa3637afb \
            --groups "internal-testers" \
            --release-notes-file release-notes.txt