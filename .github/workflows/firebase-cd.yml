name: Firebase App Distribution CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Grant permission for gradlew
      - name: Grant execute permission
        run: chmod +x gradlew

      # 4. Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. DEBUG: show generated files (VERY IMPORTANT)
      - name: Debug APK output
        run: find app/build -type f -name "*.apk"

      # 6. Install Firebase CLI
      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      # 7. Upload APK to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          APK_PATH=$(find app/build -type f -name "*.apk" | head -n 1)

          echo "Found APK: $APK_PATH"

          firebase appdistribution:distribute "$APK_PATH" \
            --app 1:439662827938:android:41cef8ff572e6aa3637afb \
            --groups "internal-testers" \
            --release-notes "Automated build from GitHub Actions" \
            --token "$FIREBASE_TOKEN"